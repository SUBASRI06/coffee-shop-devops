<!DOCTYPE html>
<html>
<head>
  <title>Coffee Cloud</title>
  <style>
    body {
      font-family: Arial;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: white;
      padding: 30px;
      width: 350px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    h1 {
      text-align: center;
      color: #6f4e37;
    }

    .item {
      margin: 10px 0;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #6f4e37;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    #total {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>☕ Coffee Cloud</h1>

    <div class="item">
      <input type="checkbox" id="espresso" value="120">
      Espresso (₹120)
      Qty: <input type="number" id="q1" value="1" min="1">
    </div>

    <div class="item">
      <input type="checkbox" id="latte" value="150">
      Latte (₹150)
      Qty: <input type="number" id="q2" value="1" min="1">
    </div>

    <div class="item">
      <input type="checkbox" id="cappuccino" value="180">
      Cappuccino (₹180)
      Qty: <input type="number" id="q3" value="1" min="1">
    </div>

    <button onclick="calculate()">Place Order</button>

    <div id="total"></div>
  </div>

<script>
function calculate() {
  let total = 0;

  if (espresso.checked) {
    total += espresso.value * q1.value;
  }

  if (latte.checked) {
    total += latte.value * q2.value;
  }

  if (cappuccino.checked) {
    total += cappuccino.value * q3.value;
  }

  document.getElementById("total").innerHTML =
    "Total Amount: ₹" + total;
}
</script>

</body>
</html>
